name: Bug report
description: Report a reproducible Markdown rendering or sanitization defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "@haneoka/vega-plugin-richtext-markdown 0.1.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Markdown reproduction
      description: Include the exact Markdown source and expected safe output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
